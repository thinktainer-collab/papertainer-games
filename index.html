<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papertainer Games</title>
<meta name="description" content="Papertainer Games — 설치 없이 브라우저에서 바로 하는 게임. 베타 테스트 중.">
<style>
  /* 어두운 오락실 화면 한 가지 모습으로 고정. 좁은 화면에서는 카드가 한 줄로 쌓인다 */
  :root {
    color-scheme: dark;
    --bg: #0b0d1c; --panel: #151933; --line: #2c3460;
    --fg: #e9ecff; --dim: #9aa3cf; --accent: #9dff66; --accent-ink: #0b1a05; --warn: #ffd23c;
    --display: "Courier New", "D2Coding", ui-monospace, monospace;
    --body: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.6;
    min-height: 100vh;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px; background-position: center top;
  }
  .wrap {
    max-width: 920px; margin: 0 auto; padding-block: 56px 40px;
    padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 40px;
  }
  header { display: flex; flex-direction: column; gap: 10px; }
  .beta { align-self: flex-start; font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: 3px; color: var(--accent-ink); background: var(--warn); padding: 3px 10px; }
  h1 { margin: 0; font-family: var(--display); font-size: clamp(34px, 9vw, 64px); line-height: 1.05; letter-spacing: -1px; color: var(--accent); text-shadow: 4px 4px 0 #14401a; text-wrap: balance; }
  header p { margin: 0; color: var(--dim); max-width: 34em; }
  h2 { margin: 0 0 14px; font-family: var(--display); font-size: 14px; letter-spacing: 4px; color: var(--dim); }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .card { display: flex; flex-direction: column; background: var(--panel); border: 2px solid var(--line); color: inherit; text-decoration: none; transition: transform .12s, border-color .12s; }
  .card:hover, .card:focus-visible { transform: translate(-3px, -3px); border-color: var(--accent); box-shadow: 6px 6px 0 #14401a; outline: none; }
  .card img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; image-rendering: pixelated; border-bottom: 2px solid var(--line); }
  .card .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card h3 { margin: 0; font-size: 20px; }
  .card p { margin: 0; font-size: 14px; color: var(--dim); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--display); font-size: 11px; }
  .tags span { border: 1px solid var(--line); padding: 1px 7px; color: var(--dim); }
  .play { margin-top: auto; align-self: flex-start; font-weight: 800; color: var(--accent-ink); background: var(--accent); padding: 7px 18px; }
  .soon { border-style: dashed; align-items: center; justify-content: center; min-height: 220px; color: var(--dim); font-family: var(--display); letter-spacing: 2px; }
  footer { font-size: 13px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 6px 18px; border-top: 1px solid var(--line); padding-top: 18px; }
  footer a { color: var(--fg); }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="beta">BETA TEST</span>
    <h1>PAPERTAINER GAMES</h1>
    <p>설치 없이 브라우저에서 바로 하는 게임. 지금은 베타 테스트 중이라 게임이 계속 바뀝니다.</p>
  </header>

  <main>
    <h2>GAMES</h2>
    <div class="games">
      <a class="card" href="zombie-maze/">
        <img src="zombie-maze/thumb.jpg" alt="미로 복도에서 다가오는 초록색 좀비와 손에 든 권총" width="604" height="390">
        <div class="body">
          <h3>좀비 미로 탈출</h3>
          <div class="tags"><span>3D 1인칭</span><span>모바일 터치</span><span>1화 · 2화 · 3화</span></div>
          <p>열쇠 4개를 찾아 미로를 빠져나가고, 메카 로봇의 레이저로 가장 센 좀비를 쓰러뜨려라. 2화는 추격전과 좀비 떼, 3화는 더 큰 메카와 엄청 빠른 좀비.</p>
          <span class="play">플레이 ▶</span>
        </div>
      </a>
      <div class="card soon">NEXT GAME · COMING SOON</div>
    </div>
  </main>

  <footer>
    <span>© Papertainer Games</span>
    <a href="https://www.papertainer.com">papertainer.com</a>
  </footer>
</div>
</body>
</html>
